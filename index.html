<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>starfall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 
  <div id="screen-start" class="screen active">
    <div id="start-bg"></div>
    <div id="start-inner">
      <div id="title-block">
        <p id="title-sub">a short story</p>
        <h1 id="title">starfall</h1>
      </div>
      <div id="start-buttons">
        <button class="menu-btn" id="btn-new">new game</button>
        <button class="menu-btn secondary" id="btn-load">continue</button>
      </div>
      <p id="start-hint">a story about a chance encounter on a rooftop</p>
    </div>
  </div>

  <div id="screen-game" class="screen">
 
    <div id="bg-layer"></div>
 
    <div id="char-layer">
      <div id="char-left" class="character hidden"></div>
      <div id="char-right" class="character hidden"></div>
    </div>
 
    <div id="history-panel" class="hidden">
      <div id="history-header">
        <span>dialogue history</span>
        <button id="btn-close-history">✕</button>
      </div>
      <div id="history-list"></div>
    </div>
 
    <div id="ui-layer">
 
      <div id="top-bar">
        <button class="ui-btn" id="btn-history">log</button>
        <button class="ui-btn" id="btn-save">save</button>
        <button class="ui-btn" id="btn-menu-game">menu</button>
      </div>
 
      <div id="dialogue-box">
        <div id="speaker-name"></div>
        <div id="dialogue-text"></div>
        <div id="click-indicator">▾</div>
      </div>
 
      <div id="choices-box" class="hidden">
        <div id="choices-list"></div>
      </div>
 
    </div>
  </div>

  <div id="screen-end" class="screen">
    <div id="end-bg"></div>
    <div id="end-inner">
      <p id="end-label">ending</p>
      <h2 id="end-title"></h2>
      <p id="end-desc"></p>
      <div id="end-buttons">
        <button class="menu-btn" id="btn-end-restart">play again</button>
        <button class="menu-btn secondary" id="btn-end-menu">main menu</button>
      </div>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
